name: E2E-Tests

# Führt echte Browser-End-to-End-Tests (Playwright) aus. Läuft seit 2026-08-02
# gegen einen frisch angelegten, wegwerfbaren Supabase-Branch statt gegen die
# Live-Produktivdatenbank: kein Aufräumen von Test-Accounts mehr nötig (siehe
# To-Do #74-Historie), der Branch wird am Ende jedes Laufs gelöscht, egal ob
# die Tests bestehen oder nicht. Weder das React-Frontend noch eine Supabase
# Edge Function können selbst einen Browser steuern — GitHub Actions ist dafür
# der einzige Ort in diesem Stack (wie beim bestehenden db-backup.yml-Workflow).
# Wird ausschließlich über das Admin-Dashboard ausgelöst
# (supabase/functions/e2e-trigger-run), nie automatisch per Zeitplan.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Welche Testsuite laufen soll"
        required: true
        default: "full"
        type: choice
        options: [full, roleA, roleB, roleC, roleD, roleE, roleF]
      run_id:
        description: "ID der e2e_runs-Zeile, gegen die das Ergebnis gemeldet wird"
        required: true
        type: string

env:
  SUPABASE_PROJECT_REF: vukqjpqawzhfvpjjpipp

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # --- Wegwerfbaren Supabase-Branch als Testumgebung anlegen ---------

      - name: Sandbox-Branch anlegen
        id: create_branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          branch_name="e2e-run-${{ inputs.run_id }}"
          resp=$(curl -sf -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/branches" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"branch_name\":\"$branch_name\"}")
          branch_id=$(echo "$resp" | jq -r '.id')
          branch_ref=$(echo "$resp" | jq -r '.project_ref')
          if [ -z "$branch_id" ] || [ "$branch_id" = "null" ]; then
            echo "::error::Branch-Erstellung lieferte keine ID zurück: $resp"
            exit 1
          fi
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "branch_ref=$branch_ref" >> "$GITHUB_OUTPUT"
          echo "Branch $branch_name angelegt (id=$branch_id, ref=$branch_ref)."

      - name: Auf Branch-Bereitschaft warten
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          branch_id="${{ steps.create_branch.outputs.branch_id }}"
          status="UNKNOWN"
          for i in $(seq 1 40); do
            status=$(curl -sf "https://api.supabase.com/v1/branches/$branch_id" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.status')
            echo "Versuch $i: Status=$status"
            if [ "$status" = "ACTIVE_HEALTHY" ]; then break; fi
            case "$status" in
              INIT_FAILED|RESTORE_FAILED|PAUSE_FAILED)
                echo "::error::Branch-Erstellung endgültig fehlgeschlagen (Status $status)."
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Branch wurde nach ~400s nicht bereit (letzter Status: $status)."
            exit 1
          fi
          # ACTIVE_HEALTHY bestätigt nur die Postgres-Instanz selbst -- der
          # Rest des API-Stacks (PostgREST-Schema-Cache, Connection-Pooler)
          # braucht danach noch unvorhersehbar lange, um vollständig
          # konsistent zu sein. Real durchlaufene Fehlerbilder direkt
          # nacheinander: fehlende Tabelle, fehlende Spalte, dann eine
          # Fremdschlüssel-Verletzung beim Insert auf eine Sekunden zuvor
          # erstellte Zeile -- ein direkter SQL-Test bestätigte, dass Trigger
          # und Fremdschlüssel bei reinem Datenbankzugriff sofort korrekt
          # funktionieren, das Problem sitzt also spezifisch auf der
          # API-Schicht. Fixe zusätzliche Wartezeit hier, weil das per-Aufruf-
          # Retry im Seed-Skript diese Verzögerung allein nicht zuverlässig
          # abfängt (real beobachtet: nach 8 Versuchen à 3s immer noch nicht
          # bereit).
          echo "Zusätzliche 20s, bis der API-Stack (PostgREST/Pooler) nachgezogen hat..."
          sleep 20

      - name: Branch-Zugangsdaten ermitteln
        id: branch_keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          branch_ref="${{ steps.create_branch.outputs.branch_ref }}"
          keys=$(curl -sf "https://api.supabase.com/v1/projects/$branch_ref/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          anon_key=$(echo "$keys" | jq -r '[.[] | select(.name=="anon")][0].api_key')
          service_key=$(echo "$keys" | jq -r '[.[] | select(.name=="service_role")][0].api_key')
          if [ -z "$service_key" ] || [ "$service_key" = "null" ]; then
            echo "::error::Kein service_role-Key für den Branch gefunden."
            exit 1
          fi
          echo "::add-mask::$service_key"
          echo "branch_url=https://$branch_ref.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon_key=$anon_key" >> "$GITHUB_OUTPUT"
          echo "service_key=$service_key" >> "$GITHUB_OUTPUT"

      - name: Test-Nutzer auf dem Branch anlegen
        working-directory: e2e
        env:
          BRANCH_URL: ${{ steps.branch_keys.outputs.branch_url }}
          SERVICE_KEY: ${{ steps.branch_keys.outputs.service_key }}
        run: |
          npm install @supabase/supabase-js --no-save --no-audit --no-fund
          node scripts/seed-e2e-users.js > seed_output.txt
          while IFS='=' read -r key val; do
            [ -z "$key" ] && continue
            case "$key" in *_PASSWORD|*_LINK) echo "::add-mask::$val" ;; esac
            echo "$key=$val" >> "$GITHUB_ENV"
          done < seed_output.txt

      # --- App gegen den Sandbox-Branch bauen und lokal bereitstellen ----

      - name: App gegen Sandbox-Branch bauen
        env:
          VITE_SUPABASE_URL: ${{ steps.branch_keys.outputs.branch_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.branch_keys.outputs.anon_key }}
        run: |
          npm ci
          npm run build

      - name: App lokal bereitstellen
        # Port 5173, nicht Vites 4173-Standard: jede Edge Function (claim-session,
        # ai-chat, ...) prüft den Origin-Header gegen eine feste ALLOWED_ORIGINS-
        # Liste, die für lokale Tests nur localhost:5173 (den normalen Dev-Server-
        # Port) enthält. Ein anderer Port hier würde jeden Edge-Function-Aufruf
        # aus dem Browser heraus per CORS blockieren -- real aufgetreten: alle
        # 6 Tests scheiterten am Login, weil claim-session den Origin
        # localhost:4173 stillschweigend ablehnte (kein Access-Control-Allow-
        # Origin-Header in der Preflight-Antwort).
        run: |
          npx vite preview --port 5173 --strictPort &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then echo "Bereit."; break; fi
            sleep 1
          done

      # --- Playwright gegen die lokal bereitgestellte Sandbox-App ausführen

      - name: Tests ausführen
        id: run_tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          E2E_SUITE: ${{ inputs.suite }}
          # Fuer roleF.auth-flows.spec.js: Signup-/Recovery-/Invite-Links
          # muessen unmittelbar vor der Nutzung generiert werden, nicht
          # Minuten vorher im Seed-Schritt -- die Links waren sonst bereits
          # abgelaufen/ungueltig, wenn dieser Test-File dran war (siehe
          # To-Do #109). Bereits in der "Branch-Zugangsdaten ermitteln"-
          # Ausgabe maskiert, bleibt es auch hier maskiert.
          BRANCH_URL: ${{ steps.branch_keys.outputs.branch_url }}
          SERVICE_KEY: ${{ steps.branch_keys.outputs.service_key }}
        # continue-on-error, damit fehlgeschlagene Tests trotzdem einen
        # Bericht erzeugen und melden, statt den Job stillschweigend rot
        # abbrechen zu lassen, ohne dass das Dashboard je etwas erfährt.
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test || echo "tests_failed=1" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Screenshots/Traces gescheiterter Tests sichern
        # playwright.config.js erzeugt bei Fehlschlägen Screenshots
        # ("screenshot: only-on-failure") und Traces ("trace: retain-on-
        # failure") in e2e/test-results/ -- bisher landete nur report.json
        # (reiner Text) als Artefakt, ohne visuellen Beweis, WAS auf dem
        # Bildschirm tatsächlich zu sehen war. if-no-files-found: ignore,
        # da dieser Ordner bei einem komplett grünen Lauf gar nicht entsteht.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ inputs.run_id }}
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Ergebnisse in Ingest-Format übersetzen
        # if: always() — läuft auch, wenn ein früherer Schritt (z. B. npm ci,
        # Playwright-Installation) fehlgeschlagen ist. build-report.js kommt
        # damit klar (results.json fehlt dann einfach) und erzeugt trotzdem
        # ein gültiges report.json — sonst bliebe die e2e_runs-Zeile für
        # immer auf "queued" stehen, ohne dass je ein Fehler gemeldet wird.
        if: always()
        working-directory: e2e
        env:
          E2E_RUN_ID: ${{ inputs.run_id }}
          E2E_SUITE: ${{ inputs.suite }}
        run: node scripts/build-report.js

      - name: Testbericht als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ inputs.run_id }}
          path: e2e/report.json
          retention-days: 30

      - name: Ergebnis an Supabase melden
        # curl -sf verschluckte bisher jede Fehlerantwort komplett (nur
        # "exit code 22" im Log, kein Hinweis warum) — real aufgetreten:
        # drei Läufe blieben dadurch stillschweigend für immer auf "queued"
        # hängen, weil sowohl dieser Schritt als auch die Notfall-Meldung
        # unten denselben (mutmaßlich falsch hinterlegten) Secret nutzen und
        # beide gleichermaßen scheiterten, ohne dass der Grund sichtbar war.
        # Jetzt wird Status UND Antworttext immer ausgegeben.
        if: always()
        env:
          INGEST_SECRET: ${{ secrets.SUPABASE_INGEST_SECRET }}
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://vukqjpqawzhfvpjjpipp.supabase.co/functions/v1/e2e-report-ingest" \
            -H "Content-Type: application/json" \
            -H "X-E2E-Ingest-Secret: $INGEST_SECRET" \
            --data @e2e/report.json || echo "000")
          echo "Antwort (Status $http_code):"
          cat response.txt 2>/dev/null || true
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::e2e-report-ingest hat mit Status $http_code abgelehnt — häufigste Ursache: E2E_INGEST_SECRET (Supabase) stimmt nicht exakt mit SUPABASE_INGEST_SECRET (GitHub) überein (z. B. Leerzeichen/Zeilenumbruch beim Einfügen)."
            exit 1
          fi

      - name: Notfall-Meldung, falls report.json nie entstanden ist
        # Zweite Sicherheitsebene: selbst wenn build-report.js aus einem
        # unerwarteten Grund selbst fehlschlägt (z. B. Node-Setup kaputt),
        # meldet dieser Schritt trotzdem "failure" statt die Zeile für immer
        # auf "queued" hängen zu lassen. Nutzt denselben Secret wie oben —
        # falls DER falsch ist, schlägt auch dieser Schritt fehl; dann bleibt
        # nur die manuelle SQL-Korrektur (dokumentation/
        # 13_SQL_Admin_Notfallreferenz, Abschnitt 6), aber wenigstens sichtbar
        # statt stillschweigend.
        if: failure()
        env:
          INGEST_SECRET: ${{ secrets.SUPABASE_INGEST_SECRET }}
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://vukqjpqawzhfvpjjpipp.supabase.co/functions/v1/e2e-report-ingest" \
            -H "Content-Type: application/json" \
            -H "X-E2E-Ingest-Secret: $INGEST_SECRET" \
            --data "{\"run_id\":${{ inputs.run_id }},\"status\":\"failure\",\"gh_run_id\":${{ github.run_id }},\"gh_workflow_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"report\":{\"report_version\":1,\"summary\":{\"total\":0,\"passed\":0,\"failed\":0,\"status\":\"FEHLER\"},\"findings\":[{\"id\":1,\"symptom\":\"Workflow ist vor Abschluss fehlgeschlagen.\",\"ursache\":\"Siehe GitHub-Actions-Log dieses Laufs.\",\"fix\":\"Noch offen.\",\"status\":\"FEHLER\"}],\"results_by_role\":[],\"incidents\":[],\"open_items\":[\"GitHub-Actions-Log prüfen.\"],\"test_accounts\":[]}}" \
            || echo "000")
          echo "Antwort (Status $http_code):"
          cat response.txt 2>/dev/null || true
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Auch die Notfall-Meldung wurde abgelehnt (Status $http_code) — die e2e_runs-Zeile bleibt auf 'queued' hängen. Manuell per SQL korrigieren, siehe dokumentation/13_SQL_Admin_Notfallreferenz, Abschnitt 6."
          fi

      # --- Aufräumen: Branch immer löschen, egal ob Tests bestanden haben -

      - name: Sandbox-Branch löschen
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          branch_id="${{ steps.create_branch.outputs.branch_id }}"
          if [ -z "$branch_id" ]; then
            echo "Kein Branch angelegt worden, nichts zu löschen."
            exit 0
          fi
          http_code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "https://api.supabase.com/v1/branches/$branch_id" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Löschen von Branch $branch_id: Status $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Branch $branch_id konnte nicht automatisch gelöscht werden (Status $http_code) — manuell im Supabase-Dashboard prüfen, damit keine laufenden Kosten übersehen werden."
          fi
